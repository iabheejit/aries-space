name: Test and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q services tests scripts

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      MINIO_ACCESS_KEY: aries-ci
      MINIO_SECRET_KEY: ci-minio-password
      API_BEARER_TOKEN: ci-api-bearer-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Validate Compose and build image
        run: |
          docker compose config --quiet
          docker compose build
      - name: Start without live upstream polling
        env:
          SCHEDULER_ENABLED: "false"
        run: docker compose up --detach --wait --wait-timeout 60
      - name: Verify runtime constraints
        run: |
          test "$(docker compose exec -T app id -u)" = "10001"
          test "$(docker compose top app | grep -v docker-init | grep -c 'uvicorn services.api.aries_api.main:app')" = "1"
          test "$(docker compose port app 8000)" = "127.0.0.1:8000"
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready
      - name: Run mandatory PostgreSQL and MinIO integration tests
        run: |
          docker compose exec -T postgres psql -U aries -d postgres \
            -c 'DROP DATABASE IF EXISTS aries_ci_test WITH (FORCE)' \
            -c 'CREATE DATABASE aries_ci_test'
          TEST_DATABASE_URL='postgresql+psycopg://aries:ci-postgres-password@127.0.0.1:5432/aries_ci_test' \
          ARIES_INTEGRATION_DATABASE_URL='postgresql+psycopg://aries:ci-postgres-password@127.0.0.1:5432/aries' \
          ARIES_INTEGRATION_MINIO_ENDPOINT='127.0.0.1:9000' \
            python -m pytest -q
      - name: Verify migrations, checksums, idempotency, and persistence
        run: python scripts/compose_smoke.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down --volumes