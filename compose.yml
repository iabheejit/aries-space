services:
  postgres:
    image: postgres:15.13-bookworm@sha256:d1f651d3a24650cd68a4e7fcf4eef7bd772c2ec965c3563f36b91c1fecddac76
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-aries}"
      POSTGRES_USER: "${POSTGRES_USER:-aries}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-aries}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aries}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}"
      API_BEARER_TOKEN: "${API_BEARER_TOKEN:?Set API_BEARER_TOKEN in .env}"
      MINIO_SECURE: "false"
      SATNOGS_FIXTURE_PATH: "${SATNOGS_FIXTURE_PATH-/app/services/api/aries_api/fixtures/satnogs_observation_14790266.json}"
      SENTINEL2_FIXTURE_PATH: "${SENTINEL2_FIXTURE_PATH-/app/services/api/aries_api/fixtures/sentinel2_crop_43QHD_128.tif}"
      SENTINEL2_COASTAL_FIXTURE_PATH: "${SENTINEL2_COASTAL_FIXTURE_PATH-/app/services/api/aries_api/fixtures/sentinel2_crop_43QBA_coastal_128.tif}"
      SENTINEL2_CROP_COL_OFF: "${SENTINEL2_CROP_COL_OFF:-5000}"
      SENTINEL2_CROP_ROW_OFF: "${SENTINEL2_CROP_ROW_OFF:-5000}"
      SENTINEL2_CROP_WIDTH: "${SENTINEL2_CROP_WIDTH:-1024}"
      SENTINEL2_CROP_HEIGHT: "${SENTINEL2_CROP_HEIGHT:-1024}"
      SENTINEL2_FETCH_TIMEOUT_SECONDS: "${SENTINEL2_FETCH_TIMEOUT_SECONDS:-20}"
      BENCHMARK_TIMEOUT_SECONDS: "${BENCHMARK_TIMEOUT_SECONDS:-10}"
      SENTINEL2_BENCHMARK_SAMPLE_ITERATIONS: "${SENTINEL2_BENCHMARK_SAMPLE_ITERATIONS:-15}"
      SENTINEL2_COASTAL_CROP_COL_OFF: "${SENTINEL2_COASTAL_CROP_COL_OFF:-0}"
      SENTINEL2_COASTAL_CROP_ROW_OFF: "${SENTINEL2_COASTAL_CROP_ROW_OFF:-0}"
      SENTINEL2_COASTAL_CROP_WIDTH: "${SENTINEL2_COASTAL_CROP_WIDTH:-1024}"
      SENTINEL2_COASTAL_CROP_HEIGHT: "${SENTINEL2_COASTAL_CROP_HEIGHT:-1024}"
      NORAD_ID: "${NORAD_ID:-68635}"
      SATELLITE_NAME: "${SATELLITE_NAME:-CANVAS}"
      STATION_NAME: "${STATION_NAME:-GHRCE campus (approx.)}"
      STATION_LAT: "${STATION_LAT:-21.1052484}"
      STATION_LON: "${STATION_LON:-79.0034903}"
      STATION_ELEV_M: "${STATION_ELEV_M:-310}"
      TLE_REFRESH_HOURS: "${TLE_REFRESH_HOURS:-12}"
      OBS_POLL_MINUTES: "${OBS_POLL_MINUTES:-10}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-false}"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  postgres-data:
  minio-data: